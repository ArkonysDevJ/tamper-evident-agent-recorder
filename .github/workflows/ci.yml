name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: node --version
      - run: npm ci
      # Type-checks, builds and runs the tests that need no PostgreSQL.
      # Tests under test/pg run locally with `npm run test:pg`.
      - run: npm test
